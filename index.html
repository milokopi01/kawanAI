<!DOCTYPE html>
<html lang="ms">
<head>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzuEGQOifhmzkPfkk9AwPxFARCziutORhvfgJD4V_J83r4tBu_a1hGq-_pOexFp-DE/exec"; // <-- BARIS KE-5: TAMPAL URL WEB APP APPS SCRIPT DI SINI
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AURA 3D — Sahabat AI & Pengesan Wajah Pintar</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#02060c">
<script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== AURA NEBULA — SKRIN PENUH: ZARAH DI ATAS, BORAK + KAMERA DI BAWAH ===== */
  :root{
    --ink:#e6f6ff; --muted:#8fb3c9;
    --glass:rgba(8,22,34,.55); --glass-strong:rgba(6,18,28,.86);
    --line:rgba(120,220,255,.16); --line-strong:rgba(120,220,255,.3);
    --cyan:#22d3ee; --sky:#0ea5e9; --rose:#f43f5e; --emerald:#10b981;
    --glow:0 0 22px rgba(34,211,238,.35);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#02060c;color:var(--ink)}
  body{background:radial-gradient(ellipse at 50% 32%,#06202e 0%,#030a12 55%,#010307 100%);overscroll-behavior:none}

  /* Kanvas zarah memenuhi seluruh skrin */
  #auraParticles{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block}

  /* Label status halus di bawah aura */
  .orb-status-label{
    position:fixed;left:50%;top:var(--label-top,54vh);transform:translateX(-50%);
    z-index:2;font-size:.78rem;font-weight:600;letter-spacing:.3px;color:rgba(200,240,255,.72);
    text-shadow:0 0 12px rgba(34,211,238,.45);white-space:nowrap;pointer-events:none;
    transition:opacity .4s ease;
  }

  /* Butang tetapan tersembunyi (sangat halus) */
  .settings-fab{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(8,22,34,.35);color:var(--ink);font-size:1.05rem;cursor:pointer;
    opacity:.45;transition:opacity .2s, transform .2s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
  }
  .settings-fab:hover,.settings-fab:focus-visible{opacity:1;transform:rotate(30deg)}
  .status-dot-mini{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#94a3b8}
  .status-dot-mini.online{background:var(--emerald);box-shadow:0 0 8px var(--emerald)}
  .status-dot-mini.error{background:var(--rose);box-shadow:0 0 8px var(--rose)}

  /* ===== DOK BAWAH: BORAK + KAMERA ===== */
  .bottom-dock{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:5;
    width:100%;max-width:760px;padding:0 12px calc(12px + var(--safe-b));
    display:flex;flex-direction:column;gap:10px;
  }
  .chat-stream{
    max-height:30vh;overflow-y:auto;padding:24px 4px 4px;display:flex;flex-direction:column;gap:10px;
    scroll-behavior:smooth;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%);
  }
  .chat-stream::-webkit-scrollbar{display:none}
  .msg-bubble{max-width:84%;padding:11px 15px;border-radius:20px;font-size:.9rem;line-height:1.5;animation:popMsg .3s ease-out;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  @keyframes popMsg{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .msg-ai{align-self:flex-start;background:rgba(10,34,50,.62);color:var(--ink);border:1px solid rgba(34,211,238,.2);border-bottom-left-radius:6px}
  .msg-user{align-self:flex-end;background:linear-gradient(135deg,rgba(14,165,233,.82),rgba(34,211,238,.72));color:#02131c;border-bottom-right-radius:6px}
  .msg-meta{font-size:.66rem;opacity:.7;margin-top:4px;font-weight:600}
  .msg-user .msg-meta{color:#032a3a}
  .msg-ai .msg-meta{color:var(--muted)}

  .chat-input-bar{
    display:flex;align-items:center;gap:8px;padding:8px;border-radius:24px;
    background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 20px 50px -15px rgba(0,0,0,.6),inset 0 1px 0 rgba(160,230,255,.1);
  }

  /* Kamera kecil di bawah */
  .camera-stage{
    position:relative;flex-shrink:0;width:52px;height:52px;border-radius:16px;overflow:hidden;cursor:pointer;
    background:#041420;border:1.5px solid var(--line-strong);box-shadow:var(--glow);
    transition:width .35s ease,height .35s ease,border-radius .35s ease;
  }
  .camera-stage.expanded{width:132px;height:100px;border-radius:18px}
  .camera-stage.face-on{border-color:rgba(34,211,238,.75)}
  video#webcam{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
  canvas#overlay{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
  .crystal-orb-container{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#041420;font-size:1.3rem;z-index:3}
  .crystal-orb-container.active{display:flex}

  .mic-fab{
    width:52px;height:52px;border-radius:16px;border:none;flex-shrink:0;cursor:pointer;font-size:1.3rem;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#02131c;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(34,211,238,.35);transition:transform .2s;
  }
  .mic-fab.listening{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 0 25px rgba(244,63,94,.65);animation:pulseMic 1s infinite alternate}
  @keyframes pulseMic{from{transform:scale(1)}to{transform:scale(1.07)}}
  .chat-text-input{flex:1;min-width:0;border:none;background:transparent;font-size:.95rem;color:var(--ink);padding:8px 6px;outline:none;font-weight:500}
  .chat-text-input::placeholder{color:rgba(143,179,201,.7)}
  .send-btn{padding:0 16px;height:44px;border-radius:14px;border:none;flex-shrink:0;cursor:pointer;font-weight:700;font-size:.85rem;
    background:rgba(34,211,238,.16);color:var(--ink);border:1px solid var(--line-strong)}

  /* ===== LACI TETAPAN (butang lain disembunyikan di sini) ===== */
  .drawer-backdrop{position:fixed;inset:0;z-index:30;background:rgba(1,4,9,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .settings-drawer{
    position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(360px,92vw);padding:20px 16px calc(20px + var(--safe-b));
    background:var(--glass-strong);border-left:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  }
  .settings-drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between}
  .drawer-head h2{font-size:1rem;font-weight:800}
  .drawer-close{background:none;border:none;color:var(--ink);font-size:1.3rem;cursor:pointer;padding:4px 8px}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap}
  .pill-3d{padding:7px 12px;border-radius:999px;font-size:.76rem;font-weight:700;background:rgba(20,50,70,.5);border:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .dot-ind{width:8px;height:8px;border-radius:50%;background:#94a3b8}
  .dot-ind.online{background:var(--emerald);box-shadow:0 0 10px var(--emerald)}
  .dot-ind.error{background:var(--rose);box-shadow:0 0 10px var(--rose)}
  .metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .metric-card{padding:10px 12px;border-radius:14px;background:rgba(3,14,24,.6);border:1px solid var(--line)}
  .metric-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .metric-val{font-size:.82rem;font-weight:800}
  .scan-progress{font-size:.78rem;font-weight:700;color:var(--cyan);min-height:16px}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btn-3d{appearance:none;cursor:pointer;font-weight:700;font-size:.8rem;padding:11px 12px;border-radius:14px;
    background:rgba(20,50,70,.55);color:#d8f3ff;border:1px solid rgba(120,220,255,.22);display:flex;align-items:center;justify-content:center;gap:6px;transition:box-shadow .2s,transform .15s}
  .btn-3d:hover{box-shadow:0 0 22px rgba(56,189,248,.4)}
  .btn-3d:active{transform:translateY(1px)}
  .btn-3d:disabled{opacity:.5;cursor:wait}
  .btn-3d.active-toggle{background:rgba(34,211,238,.22);border-color:rgba(34,211,238,.5)}
  .btn-3d.primary-3d{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#02131c;border:none}
  .btn-3d.emerald-3d{background:linear-gradient(135deg,#10b981,#059669);color:#ecfdf5;border:none}
  .api-test-result-box{padding:12px;border-radius:14px;background:rgba(3,14,24,.7);border:1px solid var(--line);font-size:.78rem;font-weight:600;line-height:1.55}
  .api-test-result-box.alive{border-color:rgba(16,185,129,.5);color:#a7f3d0}
  .api-test-result-box.dead{border-color:rgba(244,63,94,.5);color:#fecdd3}
  .api-test-result-box code{color:#fff}

  /* ===== MODAL NAMA ===== */
  .modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(1,4,9,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .modal-backdrop.hidden{display:none}
  .modal-card{max-width:420px;width:100%;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;border-radius:26px;background:var(--glass-strong);border:1px solid var(--line)}
  .modal-card h2{font-size:1.25rem;font-weight:800}
  .modal-card p{font-size:.84rem;color:var(--muted);line-height:1.5}
  .input-3d{width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(120,220,255,.2);background:rgba(3,14,24,.7);color:var(--ink);font-size:.95rem;font-weight:600;outline:none;text-align:center}

  @media (min-width:900px){ .chat-stream{max-height:32vh} }
</style>
</head>
<body>

<canvas id="auraParticles"></canvas>
<div id="orbStatusLabel" class="orb-status-label">Sedia mendengar</div>

<!-- Butang tetapan halus (butang lain disembunyikan di dalam laci) -->
<button id="btnOpenSettings" class="settings-fab" aria-label="Tetapan">⚙️<span id="miniDot" class="status-dot-mini"></span></button>

<!-- Modal Hanya Masuk Nama Sahaja -->
<div id="onboardingModal" class="modal-backdrop">
  <div class="modal-card">
    <div style="font-size: 2.4rem;">💎</div>
    <h2>Selamat Datang ke AURA 3D</h2>
    <p>Masukkan nama anda dahulu supaya sahabat AI mengenali anda, mengingati memori wajah anda, dan bersedia berborak seperti manusia biasa.</p>
    <input type="text" id="inputUserName" class="input-3d" placeholder="Masukkan nama panggilan anda..." autocomplete="off">
    <button id="btnStartApp" class="btn-3d primary-3d" style="padding: 14px; font-size: 0.94rem;">
      Mula Berbual Sekarang 🚀
    </button>
  </div>
</div>

<!-- Laci Tetapan -->
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="settingsDrawer" class="settings-drawer" aria-label="Tetapan AURA">
  <div class="drawer-head">
    <h2>💎 Tetapan AURA</h2>
    <button id="btnCloseSettings" class="drawer-close" aria-label="Tutup">✕</button>
  </div>

  <div class="pill-row">
    <div class="pill-3d"><span id="aiDot" class="dot-ind"></span><span id="aiStatusText">Memuatkan Enjin...</span></div>
    <div class="pill-3d">👤 <span id="activeUserBadge">Tetamu</span></div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Identiti Wajah</div>
      <div class="metric-val" id="detectedIdentity">⏳ Mengimbas...</div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Emosi Semasa</div>
      <div class="metric-val" id="detectedEmotion">😊 Tenang / Neutral</div>
    </div>
  </div>

  <div id="faceScanStatus" class="scan-progress"></div>

  <button id="btnRegisterFace" class="btn-3d primary-3d">📸 Rakam & Ingat Wajah Saya (3 Saat)</button>

  <div class="btn-row">
    <button id="btnHideCam" class="btn-3d">🙈 Sembunyi Kamera</button>
    <button id="btnMicOnlyMode" class="btn-3d">🎙️ Guna Mic Sahaja</button>
  </div>
  <div class="btn-row">
    <button id="btnAutoHandsfree" class="btn-3d active-toggle">🔄 Dengar Automatik: ON</button>
    <button id="btnToggleVoiceOut" class="btn-3d active-toggle">🔊 Suara AI: ON</button>
  </div>
  <div class="btn-row">
    <button id="btnChangeName" class="btn-3d">✏️ Tukar Nama</button>
    <button id="btnClearMemory" class="btn-3d">🧹 Bersih Skrin</button>
  </div>

  <button id="btnTestSheetKey" class="btn-3d emerald-3d">🔑 Uji API Key & Model (Sheet A1)</button>
  <div id="sheetKeyTestBox" class="api-test-result-box" style="display: none;"></div>
</aside>

<!-- Dok Bawah: Borak + Kamera Sahaja -->
<div class="bottom-dock">
  <div id="chatStream" class="chat-stream"></div>

  <div class="chat-input-bar">
    <div id="cameraStage" class="camera-stage" title="Tekan untuk besarkan / kecilkan kamera">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="crystalOrbView" class="crystal-orb-container"><span id="orbSphere">🎙️</span></div>
    </div>
    <button id="btnMicTalk" class="mic-fab" title="Tekan untuk bercakap">🎤</button>
    <input type="text" id="textMessageInput" class="chat-text-input" placeholder="Cakap atau taip di sini..." autocomplete="off">
    <button id="btnSendText" class="send-btn">Hantar</button>
  </div>
</div>

<script>
  /********************************************************************
   * PEMBOLEH UBAH KEADAAN & KONFIGURASI UTAMA
   ********************************************************************/
  const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";
  let userName = localStorage.getItem("aura_user_name") || "";
  let faceMemoryList = JSON.parse(localStorage.getItem("aura_face_memory_v1") || "[]");
  let chatHistory = JSON.parse(localStorage.getItem("aura_chat_history_v1") || "[]");

  // Buang sebarang cache kunci lama yang mungkin tersimpan sebelum ini
  localStorage.removeItem("aura_groq_key_cache");

  let faceMatcher = null;
  let modelsLoaded = false;
  let webcamStream = null;
  let detectionInterval = null;

  let isCameraHidden = false;
  let isMicOnlyMode = false;
  let isHandsfree = true;
  let isVoiceOutputOn = true;
  let isAiSpeaking = false;
  let isListening = false;

  let currentIdentity = "Belum Dikenali";
  let currentEmotion = "Tenang / Neutral";

  // Keadaan dikongsi dengan enjin zarah AURA (supaya zarah "hidup & faham")
  window.AURA = {
    listening: false, speaking: false, thinking: false,
    emotion: "neutral", face: { x: 0, y: 0, seen: false },
    wordKick: 0, nodAt: 0, absorbAt: 0, pokeAt: 0
  };
  const AURA = window.AURA;

  const EMOTION_MAP = {
    neutral: "😊 Tenang / Neutral",
    happy: "😄 Gembira / Ceria",
    sad: "😢 Sedih / Murung",
    angry: "😠 Tegang / Marah",
    fearful: "😟 Risau / Cemas",
    disgusted: "😣 Kurang Selesa",
    surprised: "😮 Terkejut / Teruja"
  };

  // Elemen DOM
  const onboardingModal = document.getElementById("onboardingModal");
  const inputUserName = document.getElementById("inputUserName");
  const btnStartApp = document.getElementById("btnStartApp");
  const activeUserBadge = document.getElementById("activeUserBadge");
  const aiDot = document.getElementById("aiDot");
  const aiStatusText = document.getElementById("aiStatusText");

  const videoEl = document.getElementById("webcam");
  const cameraStage = document.getElementById("cameraStage");
  const miniDot = document.getElementById("miniDot");
  const canvasEl = document.getElementById("overlay");
  const crystalOrbView = document.getElementById("crystalOrbView");
  const orbSphere = document.getElementById("orbSphere");
  const orbStatusLabel = document.getElementById("orbStatusLabel");

  const detectedIdentityEl = document.getElementById("detectedIdentity");
  const detectedEmotionEl = document.getElementById("detectedEmotion");
  const faceScanStatus = document.getElementById("faceScanStatus");

  const btnRegisterFace = document.getElementById("btnRegisterFace");
  const btnHideCam = document.getElementById("btnHideCam");
  const btnMicOnlyMode = document.getElementById("btnMicOnlyMode");
  const btnAutoHandsfree = document.getElementById("btnAutoHandsfree");
  const btnToggleVoiceOut = document.getElementById("btnToggleVoiceOut");
  const btnTestSheetKey = document.getElementById("btnTestSheetKey");
  const sheetKeyTestBox = document.getElementById("sheetKeyTestBox");
  const btnChangeName = document.getElementById("btnChangeName");
  const btnClearMemory = document.getElementById("btnClearMemory");

  const chatStream = document.getElementById("chatStream");
  const btnMicTalk = document.getElementById("btnMicTalk");
  const textMessageInput = document.getElementById("textMessageInput");
  const btnSendText = document.getElementById("btnSendText");

  /********************************************************************
   * 1. PENDAFTARAN NAMA & INISIALISASI AWAL
   ********************************************************************/
  window.addEventListener("DOMContentLoaded", () => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    if (userName) {
      onboardingModal.classList.add("hidden");
      activeUserBadge.textContent = userName;
      currentIdentity = userName;
      detectedIdentityEl.textContent = "👤 " + userName;
      mulakanSistemPenuh();
    } else {
      onboardingModal.classList.remove("hidden");
      inputUserName.focus();
    }
  });

  btnStartApp.addEventListener("click", () => {
    const val = inputUserName.value.trim();
    if (!val) {
      alert("Sila masukkan nama anda terlebih dahulu.");
      return;
    }
    userName = val;
    localStorage.setItem("aura_user_name", userName);
    activeUserBadge.textContent = userName;
    currentIdentity = userName;
    detectedIdentityEl.textContent = "👤 " + userName;
    onboardingModal.classList.add("hidden");
    mulakanSistemPenuh();
  });

  inputUserName.addEventListener("keydown", (e) => {
    if (e.key === "Enter") btnStartApp.click();
  });

  btnChangeName.addEventListener("click", () => {
    inputUserName.value = userName;
    onboardingModal.classList.remove("hidden");
  });

  async function mulakanSistemPenuh() {
    paparSejarahBorak();
    await segerakMemoriDariSheet();
    await muatModelWajah();
    if (!isMicOnlyMode) {
      await hidupkanKamera();
    }
    sediakanPengiktirafanSuara();

    if (chatHistory.length === 0) {
      const sapaan = `Hai ${userName}! Aku dah sedia. Kita boleh terus berborak menggunakan suara atau teks sekarang.`;
      tambahMesejKeSkrin("ai", sapaan);
      cakapSuaraAI(sapaan);
    }
  }

  /********************************************************************
   * 2. UJI TERUS API KEY DI DALAM GOOGLE SHEET (TAB 'apikey' SEL A1)
   ********************************************************************/
  btnTestSheetKey.addEventListener("click", async () => {
    sheetKeyTestBox.style.display = "block";
    sheetKeyTestBox.className = "api-test-result-box";
    sheetKeyTestBox.innerHTML = "⏳ Sedang menyemak kunci API di dalam Google Sheet (tab <b>apikey</b> sel <b>A1</b>)...";
    btnTestSheetKey.disabled = true;

    try {
      const res = await fetch(`${GAS_URL}?action=testKey&t=${Date.now()}`, {
        method: "GET",
        redirect: "follow"
      });
      const data = await res.json();

      if (data.alive) {
        sheetKeyTestBox.className = "api-test-result-box alive";
        sheetKeyTestBox.innerHTML = `✅ <b>API KEY SHEET A1 HIDUP!</b><br>• Kunci Dikesan: <code>${data.maskedKey}</code> (${data.keyLength} aksara)<br>• Kelajuan Groq: <b>${data.latencyMs} ms</b><br>• Model Digunakan: <b>${data.model || "-"}</b>`;
        aiDot.className = "dot-ind online";
        aiStatusText.textContent = `Sheet A1 Aktif (${data.latencyMs}ms)`;
      } else {
        sheetKeyTestBox.className = "api-test-result-box dead";
        sheetKeyTestBox.innerHTML = `❌ <b>MASALAH KUNCI DI SHEET A1:</b><br>• Kunci Dikesan: <code>${data.maskedKey || "Tiada"}</code> (${data.keyLength || 0} aksara)<br>• Ralat: ${data.message}<br><i>Pastikan anda telah klik Deploy > Manage deployments > Edit > New version di Apps Script jika baru menukar kod Code.gs.</i>`;
        aiDot.className = "dot-ind error";
        aiStatusText.textContent = "Ralat Kunci A1";
      }
    } catch (err) {
      sheetKeyTestBox.className = "api-test-result-box dead";
      sheetKeyTestBox.innerHTML = `❌ <b>GAGAL MENGHUBUNGI APPS SCRIPT:</b><br>${err.message}`;
      aiDot.className = "dot-ind error";
    }

    btnTestSheetKey.disabled = false;
  });

  /********************************************************************
   * 3. SEGERAK MEMORI WAJAH DARI GOOGLE SHEET
   ********************************************************************/
  async function segerakMemoriDariSheet() {
    if (!GAS_URL || GAS_URL.includes("MASUKKAN_URL")) {
      aiStatusText.textContent = "Semak Baris Ke-5 (GAS_URL)";
      aiDot.className = "dot-ind error";
      return;
    }
    try {
      aiStatusText.textContent = "Menyambung Google Sheet...";
      const res = await fetch(`${GAS_URL}?action=getConfig&t=${Date.now()}`, {
        method: "GET",
        redirect: "follow"
      });
      const data = await res.json();
      if (data.status === "success") {
        if (Array.isArray(data.faces) && data.faces.length > 0) {
          data.faces.forEach(remoteFace => {
            const idx = faceMemoryList.findIndex(f => f.name.toLowerCase() === remoteFace.name.toLowerCase());
            if (idx >= 0) {
              faceMemoryList[idx] = remoteFace;
            } else {
              faceMemoryList.push(remoteFace);
            }
          });
          localStorage.setItem("aura_face_memory_v1", JSON.stringify(faceMemoryList));
        }
        aiStatusText.textContent = `Sheet A1 Aktif (${data.maskedKey})`;
        aiDot.className = "dot-ind online";
      } else {
        aiStatusText.textContent = "Semak Sheet A1";
        aiDot.className = "dot-ind error";
      }
    } catch (err) {
      aiStatusText.textContent = "Sedia Berhubung";
      aiDot.className = "dot-ind online";
    }
  }

  /********************************************************************
   * 4. PENGESAN WAJAH 128-VEKTOR & EMOSI MASA NYATA (face-api.js)
   ********************************************************************/
  async function muatModelWajah() {
    try {
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL)
      ]);
      modelsLoaded = true;
      binaSemulaFaceMatcher();
    } catch (e) {
      console.error("Ralat muat model wajah:", e);
    }
  }

  function binaSemulaFaceMatcher() {
    if (!modelsLoaded || faceMemoryList.length === 0) {
      faceMatcher = null;
      return;
    }
    const labeledDescriptors = faceMemoryList.map(item => {
      const floatArrays = item.descriptors.map(d => new Float32Array(d));
      return new faceapi.LabeledFaceDescriptors(item.name, floatArrays);
    });
    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.52);
  }

  async function hidupkanKamera() {
    if (isMicOnlyMode) return;
    try {
      webcamStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      videoEl.srcObject = webcamStream;
      await videoEl.play();
      mulakanImbasanBerterusan();
    } catch (err) {
      detectedIdentityEl.textContent = "🎙️ Kamera Tidak Aktif";
      detectedEmotionEl.textContent = "Mod Audio Sahaja";
      aktifkanPaparanOrb(true, "Mod Mikrofon Sahaja Aktif");
    }
  }

  function hentikanKameraSepenuhnya() {
    if (detectionInterval) {
      clearInterval(detectionInterval);
      detectionInterval = null;
    }
    if (webcamStream) {
      webcamStream.getTracks().forEach(track => track.stop());
      webcamStream = null;
    }
    videoEl.srcObject = null;
    AURA.face.seen = false;
    AURA.emotion = "neutral";
    cameraStage.classList.remove("face-on");
    const ctx = canvasEl.getContext("2d");
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
  }

  function mulakanImbasanBerterusan() {
    if (detectionInterval) clearInterval(detectionInterval);

    detectionInterval = setInterval(async () => {
      if (!modelsLoaded || isMicOnlyMode || videoEl.paused || videoEl.ended) return;

      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 });
      const detection = await faceapi
        .detectSingleFace(videoEl, options)
        .withFaceLandmarks()
        .withFaceExpressions()
        .withFaceDescriptor();

      const ctx = canvasEl.getContext("2d");
      canvasEl.width = videoEl.videoWidth || 640;
      canvasEl.height = videoEl.videoHeight || 480;
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

      if (detection) {
        const exp = detection.expressions;
        let topEmotionKey = "neutral";
        let maxScore = 0;
        for (const [k, v] of Object.entries(exp)) {
          if (v > maxScore) {
            maxScore = v;
            topEmotionKey = k;
          }
        }
        currentEmotion = EMOTION_MAP[topEmotionKey] || "😊 Tenang / Neutral";
        detectedEmotionEl.textContent = currentEmotion;
        AURA.emotion = topEmotionKey;
        const bx = detection.detection.box;
        const vw = videoEl.videoWidth || 640, vh = videoEl.videoHeight || 480;
        AURA.face = { x: -(((bx.x + bx.width / 2) / vw) * 2 - 1), y: ((bx.y + bx.height / 2) / vh) * 2 - 1, seen: true };
        cameraStage.classList.add("face-on");

        if (faceMatcher) {
          const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
          if (bestMatch.label !== "unknown") {
            const ketepatan = Math.round((1 - bestMatch.distance) * 100);
            currentIdentity = bestMatch.label;
            detectedIdentityEl.textContent = `✅ ${bestMatch.label} (${ketepatan}%)`;
            if (userName !== bestMatch.label) {
              userName = bestMatch.label;
              activeUserBadge.textContent = userName;
            }
          } else {
            detectedIdentityEl.textContent = `👤 ${userName} (Wajah Baharu)`;
          }
        } else {
          detectedIdentityEl.textContent = `👤 ${userName} (Belum Rakam Vektor)`;
        }

        if (!isCameraHidden) {
          const box = detection.detection.box;
          ctx.strokeStyle = "rgba(14, 165, 233, 0.9)";
          ctx.lineWidth = 3;
          ctx.strokeRect(box.x, box.y, box.width, box.height);
        }
      } else {
        detectedEmotionEl.textContent = "👀 Mencari Wajah...";
        AURA.face.seen = false;
        cameraStage.classList.remove("face-on");
      }
    }, 900);
  }

  /********************************************************************
   * 5. RAKAM & INGAT SETIAP PIXEL WAJAH (128-VEKTOR KE MEMORI & SHEET)
   ********************************************************************/
  btnRegisterFace.addEventListener("click", async () => {
    if (isMicOnlyMode) {
      alert("Sila matikan 'Guna Mic Sahaja' dahulu untuk mengimbas wajah.");
      return;
    }
    if (!modelsLoaded) {
      alert("Model AI wajah sedang dimuatkan, tunggu sebentar.");
      return;
    }

    btnRegisterFace.disabled = true;
    const samples = [];
    const totalSamples = 3;

    for (let i = 1; i <= totalSamples; i++) {
      faceScanStatus.textContent = `📸 Mengimbas struktur 128-vektor wajah (${i}/${totalSamples})... Pandang kamera.`;
      await new Promise(r => setTimeout(r, 950));

      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 });
      const det = await faceapi
        .detectSingleFace(videoEl, options)
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (det && det.descriptor) {
        samples.push(Array.from(det.descriptor));
      }
    }

    if (samples.length === 0) {
      faceScanStatus.textContent = "⚠️ Wajah tidak jelas. Pastikan pencahayaan mencukupi dan cuba lagi.";
      btnRegisterFace.disabled = false;
      return;
    }

    const existingIdx = faceMemoryList.findIndex(f => f.name.toLowerCase() === userName.toLowerCase());
    const faceRecord = { name: userName, descriptors: samples };
    if (existingIdx >= 0) {
      faceMemoryList[existingIdx] = faceRecord;
    } else {
      faceMemoryList.push(faceRecord);
    }
    localStorage.setItem("aura_face_memory_v1", JSON.stringify(faceMemoryList));
    binaSemulaFaceMatcher();

    faceScanStatus.textContent = `✨ Berjaya! Wajah ${userName} telah diingati sepenuhnya dalam memori.`;
    btnRegisterFace.disabled = false;

    if (GAS_URL && !GAS_URL.includes("MASUKKAN_URL")) {
      fetch(GAS_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "saveFace",
          name: userName,
          descriptors: samples
        })
      }).catch(() => {});
    }
  });

  /********************************************************************
   * 6. KAWALAN SEMBUNYI KAMERA & MOD MIKROFON SAHAJA
   ********************************************************************/
  function aktifkanPaparanOrb(aktif, teksStatus) {
    if (aktif) {
      crystalOrbView.classList.add("active");
      if (teksStatus) orbStatusLabel.textContent = teksStatus;
    } else {
      crystalOrbView.classList.remove("active");
    }
  }

  btnHideCam.addEventListener("click", () => {
    isCameraHidden = !isCameraHidden;
    if (isCameraHidden) {
      btnHideCam.classList.add("active-toggle");
      btnHideCam.textContent = "👁️ Papar Kamera";
      aktifkanPaparanOrb(true, "Kamera Disembunyikan • AI Sedang Mendengar");
    } else {
      btnHideCam.classList.remove("active-toggle");
      btnHideCam.textContent = "🙈 Sembunyi Kamera";
      if (!isMicOnlyMode) aktifkanPaparanOrb(false);
    }
  });

  btnMicOnlyMode.addEventListener("click", async () => {
    isMicOnlyMode = !isMicOnlyMode;
    if (isMicOnlyMode) {
      btnMicOnlyMode.classList.add("active-toggle");
      btnMicOnlyMode.textContent = "📷 Hidupkan Kamera";
      hentikanKameraSepenuhnya();
      detectedIdentityEl.textContent = "🎙️ " + userName + " (Mod Suara)";
      detectedEmotionEl.textContent = "🎧 Fokus Suara Sahaja";
      aktifkanPaparanOrb(true, "Mod Mikrofon Sahaja • Kamera Dimatikan");
    } else {
      btnMicOnlyMode.classList.remove("active-toggle");
      btnMicOnlyMode.textContent = "🎙️ Guna Mic Sahaja";
      if (!isCameraHidden) aktifkanPaparanOrb(false);
      await hidupkanKamera();
    }
  });

  btnAutoHandsfree.addEventListener("click", () => {
    isHandsfree = !isHandsfree;
    btnAutoHandsfree.classList.toggle("active-toggle", isHandsfree);
    btnAutoHandsfree.textContent = isHandsfree ? "🔄 Dengar Automatik: ON" : "🔄 Dengar Automatik: OFF";
  });

  btnToggleVoiceOut.addEventListener("click", () => {
    isVoiceOutputOn = !isVoiceOutputOn;
    btnToggleVoiceOut.classList.toggle("active-toggle", isVoiceOutputOn);
    btnToggleVoiceOut.textContent = isVoiceOutputOn ? "🔊 Suara AI: ON" : "🔇 Suara AI: OFF";
    if (!isVoiceOutputOn && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  });

  /********************************************************************
   * 7. INTERAKSI SUARA (SPEECH-TO-TEXT & TEXT-TO-SPEECH KAWAN BAIK)
   ********************************************************************/
  let recognition = null;

  function sediakanPengiktirafanSuara() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) return;

    recognition = new SpeechRec();
    recognition.lang = "ms-MY";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      AURA.listening = true;
      btnMicTalk.classList.add("listening");
      orbSphere.classList.add("listening");
      orbStatusLabel.textContent = "🎙️ Sedang mendengar suara anda...";
    };

    recognition.onresult = (event) => {
      const transkrip = event.results[0][0].transcript.trim();
      if (transkrip) {
        AURA.absorbAt = performance.now();
        textMessageInput.value = transkrip;
        hantarMesejPengguna(transkrip);
      }
    };

    recognition.onerror = () => {
      isListening = false;
      AURA.listening = false;
      btnMicTalk.classList.remove("listening");
      orbSphere.classList.remove("listening");
    };

    recognition.onend = () => {
      isListening = false;
      AURA.listening = false;
      btnMicTalk.classList.remove("listening");
      orbSphere.classList.remove("listening");
      if (isHandsfree && !isAiSpeaking) {
        setTimeout(() => {
          try { if (!isAiSpeaking && !isListening) recognition.start(); } catch (e) {}
        }, 600);
      }
    };
  }

  btnMicTalk.addEventListener("click", () => {
    if (!recognition) {
      alert("Pelayar anda tidak menyokong Web Speech API. Sila gunakan Chrome atau Edge.");
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      isAiSpeaking = false;
      try { recognition.start(); } catch (e) {}
    }
  });

  /* Pilih suara PEREMPUAN Bahasa Melayu (fallback: Indonesia perempuan) */
  let suaraCache = null;
  function pilihSuaraPerempuanMelayu() {
    if (suaraCache) return suaraCache;
    const v = window.speechSynthesis.getVoices();
    if (!v.length) return null;
    const pr = /female|wanita|perempuan|yasmin|amira|gadis|damayanti|siti|nur|google bahasa/i;
    const lelaki = /male(?!.)|lelaki|osman|ardi|\bmale\b/i;
    const ms = v.filter(x => /^ms/i.test(x.lang));
    const id = v.filter(x => /^id/i.test(x.lang));
    suaraCache =
      ms.find(x => pr.test(x.name) && !/\bmale\b/i.test(x.name)) ||
      ms.find(x => !lelaki.test(x.name)) ||
      id.find(x => pr.test(x.name)) ||
      id.find(x => !lelaki.test(x.name)) ||
      ms[0] || id[0] || null;
    return suaraCache;
  }
  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => { suaraCache = null; pilihSuaraPerempuanMelayu(); };
    window.speechSynthesis.getVoices();
  }

  function cakapSuaraAI(teks) {
    if (!isVoiceOutputOn || !("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();
    const bersih = teks.replace(/[*#_~`]/g, "");
    const utterance = new SpeechSynthesisUtterance(bersih);

    const voice = pilihSuaraPerempuanMelayu();
    if (voice) { utterance.voice = voice; utterance.lang = voice.lang; } else { utterance.lang = "ms-MY"; }
    utterance.rate = 1.0;
    utterance.pitch = voice && /female|wanita|perempuan|yasmin|amira|gadis|damayanti|zira|siti|nur/i.test(voice.name) ? 1.05 : 1.25;

    utterance.onstart = () => {
      isAiSpeaking = true;
      AURA.speaking = true;
      AURA.wordKick = 1;
      if (recognition && isListening) {
        try { recognition.stop(); } catch (e) {}
      }
      orbSphere.classList.remove("listening");
      orbSphere.classList.add("speaking");
      orbStatusLabel.textContent = "🔊 Sahabat AI sedang bercakap...";
    };

    utterance.onend = () => {
      isAiSpeaking = false;
      AURA.speaking = false;
      orbSphere.classList.remove("speaking");
      orbStatusLabel.textContent = "Mod Suara Aktif • Sedia Mendengar";
      if (isHandsfree && recognition) {
        setTimeout(() => {
          try { if (!isListening) recognition.start(); } catch (e) {}
        }, 400);
      }
    };

    utterance.onerror = () => {
      isAiSpeaking = false;
      AURA.speaking = false;
      orbSphere.classList.remove("speaking");
    };

    // Setiap perkataan yang disebut membuat zarah berdenyut
    utterance.onboundary = () => { AURA.wordKick = 1; };
    window.speechSynthesis.speak(utterance);
  }

  /********************************************************************
   * 8. PENGHANTARAN MESEJ (100% MENGGUNAKAN API KEY DARI SHEET A1)
   ********************************************************************/
  btnSendText.addEventListener("click", () => {
    const teks = textMessageInput.value.trim();
    if (teks) hantarMesejPengguna(teks);
  });

  textMessageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const teks = textMessageInput.value.trim();
      if (teks) hantarMesejPengguna(teks);
    }
  });

  btnClearMemory.addEventListener("click", () => {
    chatHistory = [];
    localStorage.removeItem("aura_chat_history_v1");
    chatStream.innerHTML = "";
  });

  async function hantarMesejPengguna(mesej) {
    textMessageInput.value = "";
    const labelEmosiSemasa = isMicOnlyMode ? "Mod Mikrofon Sahaja" : currentEmotion;
    tambahMesejKeSkrin("user", mesej, labelEmosiSemasa);

    const modKameraLabel = isMicOnlyMode
      ? "Dimatikan (Berbual Guna Mikrofon Sahaja)"
      : (isCameraHidden ? "Kamera Disembunyikan" : "Kamera Aktif");

    AURA.thinking = true;
    try {
      const res = await fetch(GAS_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "chat",
          name: userName,
          emotion: labelEmosiSemasa,
          cameraMode: modKameraLabel,
          message: mesej,
          history: chatHistory.slice(-8)
        })
      });

      const data = await res.json();
      if (data.status !== "success" || !data.reply) {
        throw new Error(data.message || "Gagal memproses respons dari Google Sheet A1.");
      }

      const balasan = data.reply;
      AURA.thinking = false;
      AURA.nodAt = performance.now();

      chatHistory.push({ role: "user", content: mesej });
      chatHistory.push({ role: "assistant", content: balasan });
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
      localStorage.setItem("aura_chat_history_v1", JSON.stringify(chatHistory));

      aiDot.className = "dot-ind online";
      tambahMesejKeSkrin("ai", balasan, labelEmosiSemasa);
      cakapSuaraAI(balasan);
    } catch (err) {
      AURA.thinking = false;
      aiDot.className = "dot-ind error";
      tambahMesejKeSkrin("ai", `⚠️ Ralat: ${err.message}`);
    }
  }

  function tambahMesejKeSkrin(pengirim, teks, infoEmosi = "") {
    const div = document.createElement("div");
    div.className = `msg-bubble ${pengirim === "user" ? "msg-user" : "msg-ai"}`;

    const p = document.createElement("div");
    p.textContent = teks;
    div.appendChild(p);

    const meta = document.createElement("div");
    meta.className = "msg-meta";
    const masa = new Date().toLocaleTimeString("ms-MY", { hour: "2-digit", minute: "2-digit" });
    meta.textContent = pengirim === "user"
      ? `${userName} • ${masa} ${infoEmosi ? "• " + infoEmosi : ""}`
      : `AURA Sahabat AI • ${masa}`;
    div.appendChild(meta);

    chatStream.appendChild(div);
    chatStream.scrollTop = chatStream.scrollHeight;
  }

  /********************************************************************
   * 9. LACI TETAPAN (butang lain disembunyikan) & KAMERA KECIL
   ********************************************************************/
  const settingsDrawer = document.getElementById("settingsDrawer");
  const drawerBackdrop = document.getElementById("drawerBackdrop");
  function bukaLaci(buka) {
    settingsDrawer.classList.toggle("open", buka);
    drawerBackdrop.classList.toggle("open", buka);
  }
  document.getElementById("btnOpenSettings").addEventListener("click", () => bukaLaci(true));
  document.getElementById("btnCloseSettings").addEventListener("click", () => bukaLaci(false));
  drawerBackdrop.addEventListener("click", () => bukaLaci(false));
  btnChangeName.addEventListener("click", () => bukaLaci(false));
  cameraStage.addEventListener("click", () => cameraStage.classList.toggle("expanded"));

  // Salin status sambungan ke titik kecil pada butang tetapan
  new MutationObserver(() => { miniDot.className = "status-dot-mini " + aiDot.className.replace("dot-ind", "").trim(); })
    .observe(aiDot, { attributes: true, attributeFilter: ["class"] });

  function paparSejarahBorak() {
    chatStream.innerHTML = "";
    chatHistory.forEach(item => {
      tambahMesejKeSkrin(item.role === "user" ? "user" : "ai", item.content);
    });
  }
</script>

<script>
/* =====================================================================
 * AURA NEBULA — ZARAH HIDUP SKRIN PENUH
 * Zarah bernafas, memandang wajah anda, mendengar suara anda,
 * berpusar ketika berfikir, mengangguk bila faham, dan berdenyut
 * mengikut setiap perkataan ketika bercakap. Warna ikut emosi wajah.
 * ===================================================================== */
(function(){
  const A = window.AURA;
  const cv = document.getElementById("auraParticles"), ctx = cv.getContext("2d");
  const label = document.getElementById("orbStatusLabel");
  let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2), mobile = innerWidth < 700;

  function layout(){
    W = innerWidth; H = innerHeight; mobile = W < 700;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  layout(); addEventListener("resize", layout);

  // --- Zarah sfera (taburan Fibonacci) ---
  const N = mobile ? 1100 : 1900;
  const P = [], g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), t = g * i;
    P.push({ x: Math.cos(t) * r, y, z: Math.sin(t) * r, s: Math.random(), f: Math.random() * 6.283, d: 0.55 + Math.random() * 0.45, ox: 0, oy: 0 });
  }
  // --- Gelang orbit (muncul ketika berfikir / bercakap) ---
  const RING = mobile ? 140 : 220, Rg = [];
  for (let i = 0; i < RING; i++) Rg.push({ a: Math.random() * 6.283, r: 1.28 + Math.random() * 0.32, s: 0.4 + Math.random(), f: Math.random() * 6.283 });
  // --- Bintang latar ---
  const STARS = mobile ? 110 : 220, S = [];
  for (let i = 0; i < STARS; i++) S.push({ x: Math.random(), y: Math.random(), a: Math.random(), v: 0.00015 + Math.random() * 0.0005 });

  // --- Palet warna ikut emosi wajah (hue, saturation) ---
  const PAL = {
    neutral:   [190, 90], happy: [42, 95], sad: [222, 70], angry: [352, 80],
    fearful:   [265, 70], disgusted: [140, 65], surprised: [305, 90]
  };

  // --- Mikrofon: dengar kelantangan suara anda ---
  let analyser = null, buf = null, micLvl = 0;
  async function bukaMic(){
    if (analyser) return;
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(st);
      analyser = ac.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.fftSize); src.connect(analyser);
    } catch (e) {}
  }
  document.addEventListener("pointerdown", bukaMic, { once: true });

  // --- Sentuhan / tetikus: zarah mengelak jari anda ---
  const ptr = { x: -9999, y: -9999, on: false, t: 0 };
  addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; ptr.t = performance.now(); });
  addEventListener("pointerdown", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; ptr.t = performance.now(); A.pokeAt = performance.now(); });
  addEventListener("pointerleave", () => { ptr.on = false; });

  let rot = 0, swirl = 0, energy = 0, time = 0, last = performance.now();
  let wL = 0, wT = 0, wS = 0, wordE = 0;
  let hue = 190, sat = 90, gx = 0, gy = 0;
  let lastLabel = "";

  const lerp = (a, b, k) => a + (b - a) * k;

  function frame(now){
    const dt = Math.min((now - last) / 16.67, 3); last = now; time += 0.016 * dt;
    const listening = !!A.listening, speaking = !!A.speaking, thinking = !!A.thinking;

    // Tahap suara pengguna
    if (analyser && listening) {
      analyser.getByteTimeDomainData(buf); let s = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
      micLvl = lerp(micLvl, Math.min(1, Math.sqrt(s / buf.length) * 7), 0.35);
    } else micLvl *= 0.9;

    // Setiap perkataan AI = denyutan
    if (A.wordKick) { wordE = 1; A.wordKick = 0; }
    wordE *= Math.pow(0.9, dt);
    const speakLvl = speaking ? 0.22 + 0.55 * wordE + 0.12 * Math.abs(Math.sin(time * 7.3)) : 0;
    const listenLvl = listening ? 0.12 + micLvl : 0;

    energy = lerp(energy, Math.max(listenLvl, speakLvl, thinking ? 0.25 : 0), 0.14 * dt);
    wL = lerp(wL, listening ? 1 : 0, 0.07 * dt);
    wT = lerp(wT, thinking ? 1 : 0, 0.05 * dt);
    wS = lerp(wS, speaking ? 1 : 0, 0.08 * dt);

    // Warna ikut emosi (peralihan lembut)
    const pal = PAL[A.emotion] || PAL.neutral;
    let dh = ((pal[0] - hue + 540) % 360) - 180; hue = (hue + dh * 0.02 * dt + 360) % 360;
    sat = lerp(sat, pal[1], 0.02 * dt);
    const hueNow = hue + wT * 20 * Math.sin(time * 0.8);

    // Pandangan: ikut wajah anda, jari anda, atau merayau sendiri
    let tgx, tgy;
    const ptrFresh = ptr.on && now - ptr.t < 2500;
    if (ptrFresh) { tgx = (ptr.x / W) * 2 - 1; tgy = (ptr.y / H) * 2 - 1; }
    else if (A.face && A.face.seen) { tgx = A.face.x; tgy = A.face.y; }
    else { tgx = Math.sin(time * 0.23) * 0.45 + Math.sin(time * 0.61) * 0.15; tgy = Math.sin(time * 0.31 + 1) * 0.25; }
    gx = lerp(gx, Math.max(-1, Math.min(1, tgx)), 0.04 * dt);
    gy = lerp(gy, Math.max(-1, Math.min(1, tgy)), 0.04 * dt);

    // Angguk bila faham, "serap" bila dengar ayat habis, terkejut bila disentuh
    const tn = A.nodAt ? (now - A.nodAt) / 1000 : 9;
    const nod = tn < 1.6 ? Math.sin(tn * 11) * Math.exp(-tn * 2.6) * 0.32 : 0;
    const ta = A.absorbAt ? (now - A.absorbAt) / 1000 : 9;
    const absorb = ta < 1.2 ? Math.sin(Math.min(ta, 0.6) / 0.6 * Math.PI) * Math.exp(-ta * 1.5) : 0;
    const tp = A.pokeAt ? (now - A.pokeAt) / 1000 : 9;
    const poke = tp < 1 ? Math.exp(-tp * 4) : 0;

    // Latar & jejak
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(1,4,9,0.32)"; ctx.fillRect(0, 0, W, H);
    for (const s of S) {
      s.y -= s.v * dt * (1 + energy * 3); if (s.y < 0) s.y = 1;
      ctx.fillStyle = `rgba(140,220,255,${0.12 + 0.25 * Math.abs(Math.sin(time + s.a * 6))})`;
      ctx.fillRect(s.x * W, s.y * H, 1.2, 1.2);
    }

    // Kedudukan & saiz aura (atas skrin, tidak ditutup dok borak)
    const breath = Math.sin(time * 1.2) * 0.02;
    const baseR = mobile ? Math.min(W * 0.36, H * 0.21) : Math.min(W * 0.3, H * 0.22);
    const R = baseR * (1 + breath + energy * 0.16 - absorb * 0.14 + poke * 0.08);
    const cx = W / 2 + gx * W * 0.035;
    const cy = H * (mobile ? 0.3 : 0.32) + gy * H * 0.025 + Math.sin(time * 0.7) * 4;
    const labelTop = cy + baseR * 1.25 + 18;
    document.documentElement.style.setProperty("--label-top", labelTop + "px");

    // Cahaya teras + "mata" yang memandang anda
    const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.5);
    gr.addColorStop(0, `hsla(${hueNow},${sat}%,55%,${0.16 + energy * 0.25})`);
    gr.addColorStop(1, `hsla(${hueNow},${sat}%,40%,0)`);
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R * 1.5, 0, 6.29); ctx.fill();

    const ex = cx + gx * R * 0.32, ey = cy + gy * R * 0.26 + nod * R * 0.5;
    const eye = ctx.createRadialGradient(ex, ey, 0, ex, ey, R * 0.55);
    eye.addColorStop(0, `hsla(${hueNow + 10},100%,85%,${0.22 + energy * 0.35 + wL * 0.12})`);
    eye.addColorStop(1, `hsla(${hueNow},100%,60%,0)`);
    ctx.fillStyle = eye; ctx.beginPath(); ctx.arc(ex, ey, R * 0.55, 0, 6.29); ctx.fill();

    // Putaran: lebih laju bila berfikir; condong ke arah anda
    rot += (0.0022 + energy * 0.012) * dt;
    swirl += 0.045 * wT * dt;
    const yaw = rot + gx * 0.55;
    const tilt = 0.3 + gy * 0.45 + nod;
    const cr = Math.cos(yaw), sr = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);

    ctx.globalCompositeOperation = "lighter";
    const repelR = mobile ? 90 : 130;
    for (const p of P) {
      // Pernafasan organik
      const n = Math.sin(p.x * 3.1 + time * 0.9) + Math.sin(p.y * 2.7 - time * 0.7) + Math.sin(p.z * 3.3 + time * 1.1);
      let disp = 1 + n * 0.028;
      // Mendengar: riak mengikut suara anda
      disp += wL * (0.02 + micLvl * 0.28) * Math.sin(p.y * 9 - time * 13 + p.s);
      // Bercakap: gelombang keluar dari muka hadapan
      disp += wS * speakLvl * 0.16 * Math.sin(time * 15 - (p.z + 1) * 4.5 + p.s * 0.6);
      // Kilauan rawak
      disp += energy * Math.sin(time * 12 + p.f * 3) * 0.06 * p.s;
      disp *= 1 - absorb * 0.12;

      let x = p.x * disp, y = p.y * disp * (1 - wT * 0.38), z = p.z * disp;
      // Berfikir: lapisan berpusar pada kelajuan berbeza (seperti galaksi)
      if (wT > 0.01) {
        const a = swirl * (1 + (1 - Math.abs(p.y)) * 2.2);
        const ca = Math.cos(a), sa = Math.sin(a), nx = x * ca - z * sa; z = x * sa + z * ca; x = nx;
      }
      // Putaran global + condong
      const x1 = x * cr - z * sr, z1 = x * sr + z * cr;
      const y1 = y * ct - z1 * st, z2 = y * st + z1 * ct;
      const k = 1 / (1.9 - z2 * 0.6);
      let px = cx + x1 * R * k * 1.2, py = cy + y1 * R * k * 1.2;

      // Mengelak jari / tetikus
      if (ptrFresh) {
        const dx = px - ptr.x, dy = py - ptr.y, d2 = dx * dx + dy * dy;
        if (d2 < repelR * repelR) {
          const d = Math.sqrt(d2) || 1, push = (1 - d / repelR) * 26;
          p.ox = lerp(p.ox, dx / d * push, 0.25); p.oy = lerp(p.oy, dy / d * push, 0.25);
        } else { p.ox *= 0.92; p.oy *= 0.92; }
      } else { p.ox *= 0.92; p.oy *= 0.92; }
      px += p.ox; py += p.oy;

      const depth = (z2 + 1) / 2, alpha = (0.12 + depth * 0.88) * p.d;
      const size = (0.6 + depth * 1.8) * (1 + energy * 0.55);
      const tw = 0.6 + 0.4 * Math.sin(time * 3 + p.f);
      ctx.fillStyle = depth > 0.82
        ? `hsla(${hueNow + 10},100%,94%,${alpha * tw})`
        : `hsla(${hueNow + p.s * 28},${sat}%,${58 + depth * 26}%,${alpha * tw})`;
      const tail = x1 * sr * 2.4 * (1 + energy * 1.6);
      ctx.fillRect(px - tail, py, size + Math.abs(tail), size * 0.8);
    }

    // Gelang orbit
    const ringW = Math.max(wT, wS * 0.6, wL * 0.35);
    if (ringW > 0.02) {
      const rt = 1.15, crt = Math.cos(rt + gy * 0.3), srt = Math.sin(rt + gy * 0.3);
      for (const q of Rg) {
        q.a += (0.008 + wT * 0.03) * q.s * dt;
        const rr = q.r * (1 + wS * speakLvl * 0.12 * Math.sin(time * 9 + q.f));
        const x = Math.cos(q.a) * rr, z = Math.sin(q.a) * rr;
        const y1 = -z * srt, z2 = z * crt;
        const k = 1 / (1.9 - z2 * 0.6);
        const px = cx + x * R * k * 1.2, py = cy + y1 * R * k * 1.2 * 0.6;
        const a = ringW * (0.25 + (z2 + 1) * 0.35) * (0.6 + 0.4 * Math.sin(time * 4 + q.f));
        ctx.fillStyle = `hsla(${hueNow + 20},100%,80%,${a})`;
        ctx.fillRect(px, py, 1.6, 1.6);
      }
    }
    ctx.globalCompositeOperation = "source-over";

    // Label status lembut
    const want = A.listening ? "🎙️ Saya sedang dengar..." : A.thinking ? "💭 Saya faham, sedang berfikir..." : A.speaking ? "" : "Sedia mendengar";
    if (want !== lastLabel && label) {
      lastLabel = want;
      if (want) label.textContent = want;
      label.style.opacity = want ? "1" : "0";
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
